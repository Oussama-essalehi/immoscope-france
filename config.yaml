# Configuration du pipeline DVF — tout le périmètre d'analyse se règle ici.

data_source:
  # Vérifié sur https://www.data.gouv.fr/datasets/demandes-de-valeurs-foncieres-geolocalisees
  # (ressource « Données au format CSV » -> https://files.data.gouv.fr/geo-dvf/latest/csv/)
  base_url: "https://files.data.gouv.fr/geo-dvf/latest/csv"
  file_pattern: "{base_url}/{year}/departements/{department}.csv.gz"
  timeout_seconds: 120

# Enrichissement optionnel : revenus INSEE Filosofi 2021 (base communale).
# Page source : https://www.insee.fr/fr/statistiques/7756729
income:
  enabled: true
  url: "https://www.insee.fr/fr/statistiques/fichier/7756729/base-cc-filosofi-2021-geo2025_csv.zip"
  year: 2021

# Périmètre : les 10 régions les plus peuplées et leurs départements couverts
# par DVF. L'Alsace-Moselle (57, 67, 68) n'est pas couverte par DVF (livre
# foncier) : le Grand Est est donc partiel.
scope:
  regions:
    "11":
      name: Île-de-France
      departments: {"75": Paris, "77": Seine-et-Marne, "78": Yvelines, "91": Essonne, "92": Hauts-de-Seine, "93": Seine-Saint-Denis, "94": Val-de-Marne, "95": Val-d'Oise}
    "84":
      name: Auvergne-Rhône-Alpes
      departments: {"01": Ain, "03": Allier, "07": Ardèche, "15": Cantal, "26": Drôme, "38": Isère, "42": Loire, "43": Haute-Loire, "63": Puy-de-Dôme, "69": Rhône, "73": Savoie, "74": Haute-Savoie}
    "75":
      name: Nouvelle-Aquitaine
      departments: {"16": Charente, "17": Charente-Maritime, "19": Corrèze, "23": Creuse, "24": Dordogne, "33": Gironde, "40": Landes, "47": Lot-et-Garonne, "64": Pyrénées-Atlantiques, "79": Deux-Sèvres, "86": Vienne, "87": Haute-Vienne}
    "76":
      name: Occitanie
      departments: {"09": Ariège, "11": Aude, "12": Aveyron, "30": Gard, "31": Haute-Garonne, "32": Gers, "34": Hérault, "46": Lot, "48": Lozère, "65": Hautes-Pyrénées, "66": Pyrénées-Orientales, "81": Tarn, "82": Tarn-et-Garonne}
    "32":
      name: Hauts-de-France
      departments: {"02": Aisne, "59": Nord, "60": Oise, "62": Pas-de-Calais, "80": Somme}
    "44":
      name: Grand Est
      departments: {"08": Ardennes, "10": Aube, "51": Marne, "52": Haute-Marne, "54": Meurthe-et-Moselle, "55": Meuse, "88": Vosges}
    "93":
      name: Provence-Alpes-Côte d'Azur
      departments: {"04": Alpes-de-Haute-Provence, "05": Hautes-Alpes, "06": Alpes-Maritimes, "13": Bouches-du-Rhône, "83": Var, "84": Vaucluse}
    "52":
      name: Pays de la Loire
      departments: {"44": Loire-Atlantique, "49": Maine-et-Loire, "53": Mayenne, "72": Sarthe, "85": Vendée}
    "53":
      name: Bretagne
      departments: {"22": Côtes-d'Armor, "29": Finistère, "35": Ille-et-Vilaine, "56": Morbihan}
    "28":
      name: Normandie
      departments: {"14": Calvados, "27": Eure, "50": Manche, "61": Orne, "76": Seine-Maritime}
  # "auto" = toutes les années publiées dans le répertoire latest/csv/,
  # ou une liste explicite, ex. [2021, 2022, 2023, 2024, 2025]
  years: auto

# Villes suivies : les `top_n` communes les plus peuplées du périmètre
# (population INSEE Filosofi ; à défaut, nombre de ventes). Paris, Lyon et
# Marseille sont découpées en arrondissements dans DVF : les codes qui
# commencent par le préfixe sont regroupés sous la commune entière.
main_cities:
  top_n: 30
  # Les plus grandes villes, mises en avant dans les graphiques de tendance
  highlight_n: 5
  arrondissements: {"751": "75056", "6938": "69123", "132": "13055"}
  labels: {"75056": Paris, "69123": Lyon, "13055": Marseille}

cleaning:
  nature_mutation: "Vente"
  dwelling_types: ["Maison", "Appartement"]
  # Types de locaux tolérés à côté du logement dans une même mutation
  allowed_annex_types: ["Dépendance"]
  min_surface_m2: 9
  max_surface_m2: 1000
  min_price_eur: 10000
  max_price_eur: 20000000
  # Filtre des valeurs extrêmes de prix/m², par département x type de bien
  outlier_quantiles: [0.01, 0.99]
  outlier_groupby: ["code_departement", "type_local"]

# Tranches : "edges" = bornes inférieures (incluses) de chaque tranche.
bands:
  price:
    edges: [0, 100000, 200000, 300000, 400000, 500000, 750000]
    labels: ["< 100 k€", "100-200 k€", "200-300 k€", "300-400 k€", "400-500 k€", "500-750 k€", "≥ 750 k€"]
  surface:
    edges: [0, 30, 50, 70, 90, 120, 150]
    labels: ["< 30 m²", "30-50 m²", "50-70 m²", "70-90 m²", "90-120 m²", "120-150 m²", "≥ 150 m²"]
  rooms:
    edges: [1, 2, 3, 4, 5]
    labels: ["1 pièce", "2 pièces", "3 pièces", "4 pièces", "5 pièces et +"]

analysis:
  budgets: [150000, 250000, 350000]
  # Villes comparées entre SQL et Python (contrôle croisé)
  crosscheck_cities: [Paris, Lyon]
  # Une ville doit compter au moins ce nombre de ventes par groupe pour être testée
  min_sales_for_test: 30
  # Seuil de significativité du test de Mann-Whitney
  alpha: 0.05
  # Période de référence avant la hausse des taux et période après
  rate_rise:
    before_year: 2021
    after_year: 2023

database:
  # Valeurs par défaut du conteneur local (docker-compose.yml) ;
  # surchargeables par les variables d'environnement DVF_DB_HOST, DVF_DB_PORT,
  # DVF_DB_NAME, DVF_DB_USER, DVF_DB_PASSWORD (fichier .env non versionné).
  host: localhost
  port: 5433
  name: dvf
  user: dvf
  password: dvf_local
  schema: dvf

paths:
  raw: data/raw
  processed: data/processed
  gold: data/gold
  figures: reports/figures
  tables: reports/tables
